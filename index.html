        terms.forEach(function (term) { if (normalized.includes(term)) score += Math.min(term.length, 8); });

          $('#service-detail .office-advice').scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          const step = $('#service-detail [data-step-detail="' + stage + '"]');
          step.classList.add('is-active');
          $('#stage-detail').textContent = service.steps[stage];
          step.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
      if (event.target.closest('#speak-guide')) speakServiceGuide(serviceById(activeServiceId));
      if (event.target.closest('#stop-guide')) stopGuideSpeech();
      if (event.target.closest('#save-service')) toggleSaved(activeServiceId);
      if (event.target.closest('#make-plan')) openPlanModal(activeServiceId);
      if (event.target.closest('#print-checklist')) {
        document.body.classList.add('printing-checklist');
        window.print();
        setTimeout(function () { document.body.classList.remove('printing-checklist'); }, 400);
      }
    });
    $('#service-detail').addEventListener('change', function (event) { if (event.target.matches('[data-check]')) updateChecklistProgress(); });
    $('#document-service-select').addEventListener('change', renderDocumentChecklist);
    $('#document-checklist').addEventListener('change', function () {
      const service = serviceById($('#document-service-select').value);
      if (!service) return;
      const ready = Array.from(this.querySelectorAll('[data-document-ready]:checked')).map(function (input) { return Number(input.dataset.documentReady); });
      documentReadyByService[service.id] = ready;
      $('#document-progress-text').textContent = ready.length + ' of ' + service.docs.length + ' marked ready';
    });
    $('#document-file-input').addEventListener('change', function () {
      selectedDocumentFiles = Array.from(this.files || []);
      renderSelectedDocumentFiles();
    });
    $('#clear-document-files').addEventListener('click', function () {
      selectedDocumentFiles = [];
      $('#document-file-input').value = '';
      renderSelectedDocumentFiles();
    });
    $('#print-document-checklist').addEventListener('click', function () {
      document.body.classList.add('printing-documents');
      window.print();
      setTimeout(function () { document.body.classList.remove('printing-documents'); }, 400);
    });
    $('#assistant-open').addEventListener('click', function () {
      const isOpen = !$('#assistant-panel').classList.contains('hidden');
      $('#assistant-panel').classList.toggle('hidden', isOpen);
      this.setAttribute('aria-expanded', String(!isOpen));
      if (!isOpen) $('#assistant-question').focus();
    });
    $('#assistant-close').addEventListener('click', function () {
      $('#assistant-panel').classList.add('hidden');
      $('#assistant-open').setAttribute('aria-expanded', 'false');
      $('#assistant-open').focus();
    });
    $('#assistant-form').addEventListener('submit', function (event) {
      event.preventDefault();
      sendAssistantQuestion($('#assistant-question').value);
    });
    document.querySelectorAll('[data-assistant-prompt]').forEach(function (button) {
      button.addEventListener('click', function () { sendAssistantQuestion(this.dataset.assistantPrompt); });
    });
    $('#saved-list').addEventListener('click', function (event) {
      const remove = event.target.closest('[data-remove-saved]');
      const open = event.target.closest('[data-open-saved]');
      if (remove) toggleSaved(remove.dataset.removeSaved);
      if (open) { event.preventDefault(); renderDetail(open.dataset.openSaved); }
    });
    $('#plan-list').addEventListener('click', function (event) {
      const remove = event.target.closest('[data-remove-plan]');
      if (!remove) return;
      const plans = getStored(storageKeys.plans, []).filter(function (plan) { return plan.id !== remove.dataset.removePlan; });
      setStored(storageKeys.plans, plans);
      updatePlans();
      showToast('Visit reminder removed.');
    });
    $('#office-grid').addEventListener('click', function (event) {
      const button = event.target.closest('[data-office-plan]');
      const guide = event.target.closest('[data-office-guide]');
      if (button) openPlanModal(button.dataset.officePlan);
      if (guide) { renderDetail(guide.dataset.officeGuide); $('#service-detail').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    });
    $('#office-filter').addEventListener('input', renderOfficePreview);
    $('#refresh-offices').addEventListener('click', function () {
      officeDemoTick += 1;
      officeDemoUpdatedAt = new Date();
      renderOfficePreview();
      $('#office-status-live').textContent = 'The local sample scenario changed. No government status was checked.';
      showToast('Sample scenarios refreshed. This is not a live government update.');
    });
    $('#visit-form').addEventListener('submit', function (event) {
      event.preventDefault();
      const plans = getStored(storageKeys.plans, []);
      plans.push({ id: 'plan-' + Date.now().toString(36), serviceId: $('#plan-service').value, mode: $('#plan-mode').value, date: $('#plan-date').value });
      setStored(storageKeys.plans, plans);
      updatePlans();
      closePlanModal();
      showToast('Reminder saved on this device. It is not an appointment.');
      $('#my-desk').scrollIntoView({ behavior: 'smooth' });
    });
    $('#plan-open').addEventListener('click', function () { openPlanModal(activeServiceId); });
    $('#desk-plan-open').addEventListener('click', function () { openPlanModal(activeServiceId); });
    $('#modal-close').addEventListener('click', closePlanModal);
    $('#modal-cancel').addEventListener('click', closePlanModal);
    $('#visit-modal').addEventListener('click', function (event) { if (event.target === this) closePlanModal(); });
    $('#account-open').addEventListener('click', openAccountModal);
    $('#account-close').addEventListener('click', function () { $('#account-modal').classList.add('hidden'); });
    $('#account-modal').addEventListener('click', function (event) { if (event.target === this) this.classList.add('hidden'); });
    $('#account-form').addEventListener('submit', function (event) { event.preventDefault(); if (accountOtpSent) verifyAccountOtp(); else requestAccountOtp(); });
    $('#otp-resend').addEventListener('click', requestAccountOtp);
    $('#account-otp').addEventListener('input', function () { this.value = this.value.replace(/\D/g, '').slice(0, 6); });
    $('#pincode-form').addEventListener('submit', function (event) {
      event.preventDefault(); const pin = $('#pincode-input').value.trim();
      if (!/^\d{6}$/.test(pin)) { $('#pincode-input').reportValidity(); return; }
      lookupPincode(pin);
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        closePlanModal(); closeSosModal(); $('#account-modal').classList.add('hidden');
        $('#assistant-panel').classList.add('hidden');
        $('#assistant-open').setAttribute('aria-expanded', 'false');
      }
    });
    $('#voice-button').addEventListener('click', startVoiceSearch);
    $('#language-select').addEventListener('change', function () { applyLanguage(this.value); });
    $('#location-select').addEventListener('change', function () { updatePlaceGreeting(); renderOfficePreview(); loadCityApis(false); if (activeServiceId) renderDetail(activeServiceId); });
    $('#weather-refresh').addEventListener('click', function () { loadCityApis(true); });
    $('#sos-open').addEventListener('click', openSosModal);
    $('#sos-close').addEventListener('click', closeSosModal);
    $('#sos-modal').addEventListener('click', function (event) { if (event.target === this) closeSosModal(); });
    $('#sos-form').addEventListener('submit', prepareSosNote);
    $('#copy-sos').addEventListener('click', copySosNote);
    $('#menu-button').addEventListener('click', function () {
      const nav = $('#main-nav');
      const isOpen = nav.classList.toggle('open');
      this.setAttribute('aria-expanded', String(isOpen));
    });
    $('#main-nav').addEventListener('click', function (event) {
      if (event.target.closest('a')) { this.classList.remove('open'); $('#menu-button').setAttribute('aria-expanded', 'false'); }
    });

    renderServices();
    initDocumentHelper();
    renderSelectedDocumentFiles();
    updateDesk();
    try {
      const savedPlace = localStorage.getItem('govease.location.v1');
      if (savedPlace && Array.from($('#location-select').options).some(function (option) { return option.value === savedPlace; })) $('#location-select').value = savedPlace;
      const language = localStorage.getItem('govease.language.v1');
      if (language && i18n[language]) { $('#language-select').value = language; applyLanguage(language); }
    } catch (e) {}
    updatePlaceGreeting();
    renderOfficePreview();
    loadCityApis(false);
  </script>
</body>
</html>
